<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Solutions</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <article class="auth-card">
      <section class="brand-panel" aria-label="Home Solutions branding">
        <img class="brand-logo" src="homes.svg" alt="Home Solutions logo">
      </section>

      <section class="form-panel">
        <div class="form-shell">
          <h1>Log In</h1>

          <form class="login-form">
            <label class="sr-only" for="email">E-mail</label>
            <input id="email" name="email" type="email" placeholder="e-mail" autocomplete="email">

            <label class="sr-only" for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="password" autocomplete="current-password">

            <button type="submit">Log In</button>
          </form>

          <p class="register-copy">
            Don't have an account?
            <a href="#">Register</a>
          </p>
        </div>
      </section>
    </article>
  </main>
</body>
</html>
